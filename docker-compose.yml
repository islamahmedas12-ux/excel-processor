services:
  postgres:
    image: postgres:16-alpine
    container_name: excel-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-excel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-excel_processor}
    volumes:
      - excel-pg-data:/var/lib/postgresql/data
    ports:
      # 5433 on host to avoid colliding with the SSH tunnel (5432 forwards remote Postgres)
      - "5433:5432"
    networks:
      - excel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-excel} -d ${POSTGRES_DB:-excel_processor}"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: excel-minio-local
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-excel}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - excel-minio-data:/data
    ports:
      # Use 9100/9101 on host to avoid colliding with the SSH tunnel (which uses 9000/9001 for the remote MinIO)
      - "9100:9000"
      - "9101:9001"
    networks:
      - excel-net

  backend:
    build: .
    container_name: excel-backend
    restart: unless-stopped
    env_file: .env
    environment:
      FRONTEND_URL: http://localhost:3000
      # Connect to the in-compose MinIO (overrides .env's pointer to remote MinIO)
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-excel}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      # Use the in-compose Postgres for local dev (fast). Production deployments override this.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./backend/data:/app/backend/data
    ports:
      - "5000:5000"
    networks:
      - excel-net

  frontend:
    build: ./frontend
    container_name: excel-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - excel-net

  admin:
    build: ./admin
    container_name: excel-admin
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3100:80"
    networks:
      - excel-net

  landing:
    build:
      context: ./landing
      args:
        BACKEND_URL: http://backend:5000
    container_name: excel-landing
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:5000
    ports:
      - "4200:4200"
    networks:
      - excel-net

networks:
  excel-net:
    driver: bridge

volumes:
  excel-pg-data:
  excel-minio-data:
